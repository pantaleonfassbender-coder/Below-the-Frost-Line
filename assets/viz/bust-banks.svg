<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="bb-t bb-d" font-family="var(--serif)">
<title id="bb-t">What the depositors got back</title><desc id="bb-d">American National Bank, closed 15 May 1928: deposits $462,489, 18.5 cents on the dollar returned; First Bank and Trust Co., closed 17 July 1929: deposits $513,091, 18.25 cents on the dollar returned; Bank of Sarasota, closed 29 August 1932: deposits $719,519, 42.5 cents on the dollar returned; Ringling Bank and Trust Co., closed 1 May 1933: deposits not given, 100 cents on the dollar returned. The Ringling bank's depositors were paid in full by Edith Ringling.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">What the depositors got back</text>
<a href="#/text/bust/bust/2"><text x="16" y="48" font-size="13" fill="var(--ink2)" text-decoration="underline">Cents returned on each dollar deposited, Sarasota banks closed 1928–1933, as Grismer gives them. Link to the passage.</text></a>
<line x1="330" y1="66" x2="330" y2="262" stroke="var(--line)"/><text x="330" y="280" font-size="12" text-anchor="middle" fill="var(--ink2)">0¢</text>
<line x1="462" y1="66" x2="462" y2="262" stroke="var(--line)"/><text x="462" y="280" font-size="12" text-anchor="middle" fill="var(--ink2)">25¢</text>
<line x1="595" y1="66" x2="595" y2="262" stroke="var(--line)"/><text x="595" y="280" font-size="12" text-anchor="middle" fill="var(--ink2)">50¢</text>
<line x1="728" y1="66" x2="728" y2="262" stroke="var(--line)"/><text x="728" y="280" font-size="12" text-anchor="middle" fill="var(--ink2)">75¢</text>
<line x1="860" y1="66" x2="860" y2="262" stroke="var(--line)"/><text x="860" y="280" font-size="12" text-anchor="middle" fill="var(--ink2)">100¢</text>
<text x="16" y="89" font-size="13" fill="var(--ink)">American National Bank</text><text x="16" y="105" font-size="11.5" fill="var(--ink2)">15 May 1928 · deposits $462,489</text><rect x="330" y="80" width="98.0" height="24" fill="var(--promise)"/><text x="434" y="97" font-size="12.5" text-anchor="start" fill="var(--ink)">18.5¢</text>
<text x="16" y="135" font-size="13" fill="var(--ink)">First Bank and Trust Co.</text><text x="16" y="151" font-size="11.5" fill="var(--ink2)">17 July 1929 · deposits $513,091</text><rect x="330" y="126" width="96.7" height="24" fill="var(--promise)"/><text x="433" y="143" font-size="12.5" text-anchor="start" fill="var(--ink)">18.25¢</text>
<text x="16" y="181" font-size="13" fill="var(--ink)">Bank of Sarasota</text><text x="16" y="197" font-size="11.5" fill="var(--ink2)">29 August 1932 · deposits $719,519</text><rect x="330" y="172" width="225.2" height="24" fill="var(--promise)"/><text x="561" y="189" font-size="12.5" text-anchor="start" fill="var(--ink)">42.5¢</text>
<text x="16" y="227" font-size="13" fill="var(--ink)">Ringling Bank and Trust Co.</text><text x="16" y="243" font-size="11.5" fill="var(--ink2)">1 May 1933 · deposits not given</text><rect x="330" y="218" width="530.0" height="24" fill="var(--colony)"/><text x="854" y="235" font-size="12.5" text-anchor="end" fill="var(--panel)">100¢ — paid by Edith Ringling</text>
<text x="16" y="310" font-size="12" fill="var(--ink2)">The Palmer National Bank, opened in 1929, closed only during the national bank holiday of 1933 and reopened.</text>
</svg>