<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="vw-t vw-d" font-family="var(--serif)">
<title id="vw-t">Ways in and out, 1886–1903</title><desc id="vw-d">Water, rail and the village on one time line: 1886 Company wharf; steamer Erie to Tampa; 1887 De Soto Hotel opens; 1888 Weeds in Main Street; 1889 De Soto open “for the season”; 1892 Rail from Braidentown (“Slow and Wobbly”); 1894 Freeze, 27 Dec.; 1895 Freeze, 8 Feb.: 14 degrees; 1895 Channel dredged; Mistletoe calls; 1902 Town incorporated: 53 voters; 1903 Seaboard train, 22 March.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Ways in and out, 1886–1903</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">How a village with no road worth the name was reached, and what happened while it waited. Each mark links to its passage.</text>
