<line x1="644" y1="70" x2="644" y2="360" stroke="var(--line)" stroke-dasharray="2 4"/><text x="644" y="378" font-size="12" text-anchor="middle" fill="var(--ink2)">1898</text>
<line x1="726" y1="70" x2="726" y2="360" stroke="var(--line)" stroke-dasharray="2 4"/><text x="726" y="378" font-size="12" text-anchor="middle" fill="var(--ink2)">1900</text>
<line x1="808" y1="70" x2="808" y2="360" stroke="var(--line)" stroke-dasharray="2 4"/><text x="808" y="378" font-size="12" text-anchor="middle" fill="var(--ink2)">1902</text>
