<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="pt-t pt-d" font-family="var(--serif)">
<title id="pt-t">Two stories on one bay, 1884–1887</title><desc id="pt-d">Time line from mid-1884 to April 1887. Upper track, the company and the colony: Prospectus: 47,000 acres “below the frost line”; Colonists land (late December); Tait: “in excellent health”; Snow (“about January 9”); McKinlay leaves for Tampa; “The now notorious colony”. Lower track, the vigilance committee and the courts: Riley killed; Abbe killed, 27 Dec.; Arrests reported; Indictments, March; Verdict, 14 July; Supreme Court affirms (January term 1886).</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Two stories on one bay, 1884–1887</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">The company and its colony above, the vigilance committee and the courts below. Each mark links to its passage.</text>
<line x1="40" y1="215" x2="890" y2="215" stroke="var(--line)" stroke-width="2"/>
<line x1="186" y1="70" x2="186" y2="345" stroke="var(--line)" stroke-dasharray="3 3"/><text x="190" y="229" font-size="12" fill="var(--ink2)">1885</text>
<line x1="477" y1="70" x2="477" y2="345" stroke="var(--line)" stroke-dasharray="3 3"/><text x="481" y="229" font-size="12" fill="var(--ink2)">1886</text>
<line x1="769" y1="70" x2="769" y2="345" stroke="var(--line)" stroke-dasharray="3 3"/><text x="773" y="229" font-size="12" fill="var(--ink2)">1887</text>
<text x="40" y="78" font-size="12.5" font-weight="bold" fill="var(--promise)">The company and the colony</text>
<text x="40" y="376" font-size="12.5" font-weight="bold" fill="var(--law)">The vigilance committee and the courts</text>
<line x1="132" y1="175" x2="132" y2="163" stroke="var(--promise)"/><circle cx="132" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/prospectus/6"><text x="136" y="157" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Prospectus: 47,000 acres “below the frost line”</text></a>
<line x1="467" y1="175" x2="467" y2="163" stroke="var(--promise)"/><circle cx="467" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/colony/2"><text x="471" y="157" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Colonists land (late December)</text></a>
<line x1="480" y1="175" x2="480" y2="144" stroke="var(--promise)"/><circle cx="480" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/colony/2"><text x="484" y="138" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Tait: “in excellent health”</text></a>
<line x1="484" y1="175" x2="484" y2="125" stroke="var(--promise)"/><circle cx="484" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/colony/5"><text x="488" y="119" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Snow (“about January 9”)</text></a>
<line x1="514" y1="175" x2="514" y2="106" stroke="var(--promise)"/><circle cx="514" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/colony/7"><text x="518" y="100" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">McKinlay leaves for Tampa</text></a>
<line x1="854" y1="175" x2="854" y2="163" stroke="var(--promise)"/><circle cx="854" cy="175" r="5" fill="var(--promise)"/>
<a href="#/text/prospectus/verdict/2"><text x="850" y="157" font-size="12" text-anchor="end" fill="var(--ink)" text-decoration="underline">“The now notorious colony”</text></a>
<line x1="76" y1="255" x2="76" y2="271" stroke="var(--law)"/><circle cx="76" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/4"><text x="80" y="283" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Riley killed</text></a>
<line x1="183" y1="255" x2="183" y2="290" stroke="var(--law)"/><circle cx="183" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/7"><text x="187" y="302" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Abbe killed, 27 Dec.</text></a>
<line x1="210" y1="255" x2="210" y2="309" stroke="var(--law)"/><circle cx="210" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/2"><text x="214" y="321" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Arrests reported</text></a>
<line x1="246" y1="255" x2="246" y2="328" stroke="var(--law)"/><circle cx="246" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/9"><text x="250" y="340" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Indictments, March</text></a>
<line x1="344" y1="255" x2="344" y2="271" stroke="var(--law)"/><circle cx="344" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/9"><text x="348" y="283" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Verdict, 14 July</text></a>
<line x1="489" y1="255" x2="489" y2="290" stroke="var(--law)"/><circle cx="489" cy="255" r="5" fill="var(--law)"/>
<a href="#/text/prospectus/vigilance/11"><text x="493" y="302" font-size="12" text-anchor="start" fill="var(--ink)" text-decoration="underline">Supreme Court affirms (January term 1886)</text></a>
<line x1="40" y1="175" x2="890" y2="175" stroke="var(--promise)" stroke-width="1.5"/><line x1="40" y1="255" x2="890" y2="255" stroke="var(--law)" stroke-width="1.5"/>
</svg>